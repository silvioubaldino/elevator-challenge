name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build -w apps/web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: .github/scripts/publish-pages.sh apps/web/dist
        env:
          PUBLISH_MESSAGE: "Prod: ${{ github.sha }}"
