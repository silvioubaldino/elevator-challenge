name: Preview

on:
  issue_comment:
    types: [created]

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PREVIEW_PATH: preview/pr-${{ github.event.issue.number }}

jobs:
  guard:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/preview') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes > /dev/null
          pr=$(gh api "repos/$REPO/pulls/$NUMBER")
          if [ "$(jq -r .head.repo.full_name <<<"$pr")" != "$REPO" ]; then
            gh pr comment "$NUMBER" --repo "$REPO" --body "Preview só roda para PRs do próprio repositório (não de forks)."
            exit 1
          fi
          echo "sha=$(jq -r .head.sha <<<"$pr")" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: main
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
          path: pr
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "*/package-lock.json"
      - run: npm ci
        working-directory: main
      - run: npm run build -w apps/web
        working-directory: main
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: npm ci
        working-directory: pr
      - run: npm run typecheck
        working-directory: pr
      - run: npm run build -w apps/web
        working-directory: pr
        env:
          BASE_PATH: /${{ github.event.repository.name }}/${{ env.PREVIEW_PATH }}/
      - run: |
          mkdir -p "site/$PREVIEW_PATH"
          cp -r main/apps/web/dist/. site/
          cp -r pr/apps/web/dist/. "site/$PREVIEW_PATH/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          URL: ${{ steps.deployment.outputs.page_url }}${{ env.PREVIEW_PATH }}/
        run: gh pr comment "$NUMBER" --repo "$REPO" --body "Preview pronto: $URL"
